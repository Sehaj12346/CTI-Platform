<!DOCTYPE html>
<html>
<head>
    <title>CTI Support Request</title>
</head>

<body>

    <h1>Threat Enquiry / Support Request</h1>

    <input type="text" id="name" placeholder="Name">
    <br><br>

    <input type="email" id="email" placeholder="Email">
    <br><br>

    <input type="text" id="subject" placeholder="Subject">
    <br><br>

    <textarea id="message" placeholder="Describe your enquiry"></textarea>
    <br><br>

    <button id="submitBtn">Submit Request</button>

    <p id="result"></p>

    <script>
    document.getElementById("submitBtn").addEventListener("click", function () {

        const name = document.getElementById("name").value;
        const email = document.getElementById("email").value;
        const subject = document.getElementById("subject").value;
        const message = document.getElementById("message").value;

        const apiUrl = "https://bo338k9gei.execute-api.us-east-1.amazonaws.com/default/SupportRequestHandler";

        const url =
            apiUrl +
            "?name=" + encodeURIComponent(name) +
            "&email=" + encodeURIComponent(email) +
            "&subject=" + encodeURIComponent(subject) +
            "&message=" + encodeURIComponent(message);

        window.location.href = url;
    });
</script>

</body>
</html>
